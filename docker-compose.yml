services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: parking-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok >/dev/null 2>&1"]
      interval: 15s
      timeout: 7s
      retries: 3

  simulator:
    build: ./simulator
    container_name: parking-simulator
    restart: no
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      PARKING_SPACES: "8"
      PUBLISH_INTERVAL_SECONDS: "3"
    depends_on:
      mosquitto:
        condition: service_healthy

  processor:
    build: ./processor
    container_name: parking-processor
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      OCCUPIED_DISTANCE_CM: "30"
    depends_on:
      mosquitto:
        condition: service_healthy

  api:
    build: ./api
    container_name: parking-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SQLITE_PATH: /data/events.db
      CLOUD_API_URL: ${CLOUD_API_URL:-}
      DEVICE_TOKEN: ${DEVICE_TOKEN:-}
      DEVICE_ID: ${DEVICE_ID:-parking-demo-01}
      ORG_ID: ${ORG_ID:-demo-org}
      SITE_ID: ${SITE_ID:-demo-site}
    volumes:
      - parking_sqlite:/data
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  parking_sqlite:
  mosquitto_data:
  mosquitto_log:
