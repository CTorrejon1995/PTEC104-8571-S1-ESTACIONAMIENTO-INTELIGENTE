services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: parking-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok >/dev/null 2>&1"]
      interval: 15s
      timeout: 7s
      retries: 3

  simulator:
    build: ./simulator
    container_name: parking-simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      PARKING_SPACES: "8"
      PUBLISH_INTERVAL_SECONDS: "3"
    depends_on:
      mosquitto:
        condition: service_healthy

  processor:
    build: ./processor
    container_name: parking-processor
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      OCCUPIED_DISTANCE_CM: "30"
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  mosquitto_data:
  mosquitto_log:
